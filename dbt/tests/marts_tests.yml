version: 2

models:
  - name: dim_volunteer
    tests:
      - not_null:
          column_name: volunteer_id
      - unique:
          column_name: volunteer_id

  - name: dim_project
    tests:
      - not_null:
          column_name: project_id
      - unique:
          column_name: project_id
      - accepted_values:
          column_name: status
          values: ['Intake', 'Active', 'Complete', 'On hold']
          config:
            severity: warn

  - name: dim_event
    tests:
      - not_null:
          column_name: event_id
      - unique:
          column_name: event_id
      - accepted_values:
          column_name: event_type
          values: ['Monthly meeting', 'CityCamp', 'Community event', 'Other']
          config:
            severity: warn

  - name: fct_attendance
    tests:
      - not_null:
          column_name: attendance_id
      - not_null:
          column_name: volunteer_id
      - not_null:
          column_name: event_id
      - not_null:
          column_name: occasion_date
      - unique:
          column_name: attendance_id
      - relationships:
          column_name: volunteer_id
          to: ref('dim_volunteer')
          field: volunteer_id
      - relationships:
          column_name: event_id
          to: ref('dim_event')
          field: event_id
      - accepted_values:
          column_name: status
          values: ["Attended", "RSVP'd", "No-show", "Absent", "Remote"]
          config:
            severity: warn

  - name: fct_project_volunteer
    tests:
      - not_null:
          column_name: join_id
      - not_null:
          column_name: volunteer_id
      - not_null:
          column_name: project_id
      - unique:
          column_name: join_id
      - relationships:
          column_name: volunteer_id
          to: ref('dim_volunteer')
          field: volunteer_id
      - relationships:
          column_name: project_id
          to: ref('dim_project')
          field: project_id
      - accepted_values:
          column_name: status
          values: ['Active', 'Completed', 'Departed']
          config:
            severity: warn
