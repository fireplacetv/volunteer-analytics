version: 2

models:
  - name: dim_volunteer
    description: Dimension table for volunteers. Excludes PII (names, emails, demographics). Deferred multi-select fields (skills, availability, language) are in staging for Phase 3 metrics.
    config:
      materialized: table
    columns:
      - name: volunteer_id
        description: Airtable volunteer record ID. Primary key.
        tests:
          - not_null
          - unique

      - name: status
        description: Pending / Active / Inactive / Alumni
        tests:
          - accepted_values:
              values: ['Pending', 'Active', 'Inactive', 'Alumni']
              config:
                severity: warn

      - name: joined_date
        description: Date volunteer was activated. Null while Pending.

      - name: employment_status
        description: Current employment status.

      - name: hours_per_month
        description: Self-reported availability band (0–4 / 5–9 / 10–19 / 20–39 / 40+)

      - name: state
        description: US state of residence.

      - name: timezone
        description: Timezone of volunteer.

      - name: has_board_leadership_experience
        description: Boolean. Null checkbox → false.

      - name: has_grant_writing_experience
        description: Boolean. Null checkbox → false.

      - name: airtable_created_at
        description: Timestamp when record was created in Airtable (audit trail).

      - name: airtable_modified_at
        description: Last modified timestamp in Airtable (audit trail).

  - name: dim_project
    description: Dimension table for projects. One row per project. Key is project_id (auto-ID, human-readable).
    config:
      materialized: table
    columns:
      - name: project_id
        description: Airtable project auto-ID. Primary key, human-readable.
        tests:
          - not_null
          - unique

      - name: airtable_record_id
        description: Airtable record ID. For tracing back to Airtable.

      - name: project_number
        description: Project number (secondary identifier).

      - name: project_name
        description: Project name.

      - name: status
        description: Project status (Intake / Active / Complete / On hold)
        tests:
          - accepted_values:
              values: ['Intake', 'Active', 'Complete', 'On hold']
              config:
                severity: warn

      - name: stakeholder
        description: Partner organization name.

      - name: description
        description: Project description.

      - name: start_date
        description: Project start date.

      - name: end_date
        description: Project end date. Null until formally closed.

      - name: airtable_created_at
        description: Timestamp when record was created in Airtable (audit trail).

      - name: airtable_modified_at
        description: Last modified timestamp in Airtable (audit trail).

  - name: dim_event
    description: Dimension table for events. Includes synthetic row 0 for all monthly meetings (which share one pseudo-event).
    config:
      materialized: table
    columns:
      - name: event_id
        description: Airtable event auto-ID. Primary key. 0 = all monthly meetings.
        tests:
          - not_null
          - unique

      - name: airtable_record_id
        description: Airtable record ID. Null for synthetic row 0.

      - name: event_name
        description: Event name.

      - name: event_type
        description: Event type (Monthly meeting / CityCamp / Community event / Other)
        tests:
          - accepted_values:
              values: ['Monthly meeting', 'CityCamp', 'Community event', 'Other']
              config:
                severity: warn

      - name: event_date
        description: Date when event occurs. Null for row 0 (monthly meetings; date stored per attendance).

      - name: description
        description: Event description.

      - name: airtable_created_at
        description: Timestamp when record was created in Airtable. Null for row 0.

      - name: airtable_modified_at
        description: Last modified timestamp in Airtable. Null for row 0.

      - name: is_monthly_meeting
        description: Derived. True when event_id = 0.

  - name: fct_attendance
    description: Fact table for attendance records. One row per Event attendance entry. Links to dim_volunteer, dim_event. Monthly meetings (event_id = 0) share pseudo-event; actual date in occasion_date.
    config:
      materialized: table
    columns:
      - name: attendance_id
        description: Airtable attendance record ID. Primary key.
        tests:
          - not_null
          - unique

      - name: volunteer_id
        description: FK to dim_volunteer. May be null for orphaned attendance (warn test).
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              to: ref('dim_volunteer')
              field: volunteer_id

      - name: event_id
        description: FK to dim_event. 0 = monthly meeting (all monthly meetings share this pseudo-event).
        tests:
          - not_null
          - relationships:
              to: ref('dim_event')
              field: event_id

      - name: is_monthly_meeting
        description: Derived. True when event_id = 0.

      - name: occasion_type
        description: Event type. Via dim_event (Monthly meeting / CityCamp / Community event / Other).

      - name: occasion_date
        description: Date of attendance. Hard not_null (monthly meetings stored per attendance, not event).
        tests:
          - not_null:
              config:
                severity: warn

      - name: status
        description: Attendance status (Attended / RSVP'd / No-show / Absent / Remote)
        tests:
          - accepted_values:
              values: ["Attended", "RSVP'd", "No-show", "Absent", "Remote"]
              config:
                severity: warn

      - name: is_present
        description: Derived. True when status IN ('Attended', 'Remote').

      - name: airtable_created_at
        description: Timestamp when record was created in Airtable (audit trail).

      - name: airtable_modified_at
        description: Last modified timestamp in Airtable (audit trail).

  - name: fct_project_volunteer
    description: Fact table for project-volunteer relationships. One row per Project volunteers entry. Links to dim_volunteer, dim_project. Arrays expanded from json_blob.
    config:
      materialized: table
    columns:
      - name: join_id
        description: Airtable project_volunteers record ID. Primary key.
        tests:
          - not_null
          - unique

      - name: volunteer_id
        description: FK to dim_volunteer. Extracted from linked record array [0].
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              to: ref('dim_volunteer')
              field: volunteer_id

      - name: project_id
        description: FK to dim_project. Extracted from linked record array [0].
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              to: ref('dim_project')
              field: project_id

      - name: role
        description: Free-text role on project (e.g. UX Designer).

      - name: commitment_date
        description: Date volunteer committed to project. Null for outreach-only rows.

      - name: end_date
        description: Date volunteer ended engagement on project.

      - name: status
        description: Current status (Active / Completed / Departed)
        tests:
          - accepted_values:
              values: ['Active', 'Completed', 'Departed']
              config:
                severity: warn

      - name: outreach_attempt_count
        description: Derived. Count of non-null outreach_N_date fields (0–3).

      - name: first_outreach_date
        description: Date of first outreach attempt.

      - name: last_outreach_date
        description: Derived. Date of most recent outreach attempt.

      - name: last_outreach_status
        description: Derived. Status of most recent outreach (Emailed / Responded / No response).

      - name: is_declined
        description: Boolean. Null checkbox → false. Whether volunteer declined involvement.

      - name: decline_reason
        description: Reason for decline (if any).

      - name: airtable_created_at
        description: Timestamp when record was created in Airtable (audit trail).

      - name: airtable_modified_at
        description: Last modified timestamp in Airtable (audit trail).
