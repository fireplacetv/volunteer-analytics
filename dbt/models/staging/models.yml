version: 2

models:
  - name: stg_volunteers
    description: One-to-one staging for volunteer records. Core fields extracted for Phase 2; deferred multi-select fields (availability, language_fluency, nonprofit_skills, tech_skills, skills_to_develop, roles_interested_in) stay in json_blob for Phase 3 parsing.
    columns:
      - name: id
        description: Volunteer record ID from Airtable (primary key)
        data_tests:
          - not_null
          - unique
      - name: created_time
        description: Timestamp when record was created in Airtable
      - name: last_modified
        description: Last modified timestamp for incremental loading
      - name: status
        description: Pending / Active / Inactive / Alumni
      - name: joined_date
        description: Date volunteer was activated (null while Pending)
      - name: employment_status
        description: Current employment status of volunteer
      - name: hours_per_month
        description: Self-reported availability band (0–4 / 5–9 / 10–19 / 20–39 / 40+)
      - name: state
        description: US state of residence
      - name: timezone
        description: Timezone of volunteer
      - name: board_leadership_experience
        description: Null checkbox → false in mart (has board leadership experience)
      - name: grant_writing_experience
        description: Null checkbox → false in mart (has grant writing experience)
      - name: tech_languages_tools
        description: Tech skills (deferred to Phase 3 for normalization)
      - name: first_name
        description: Fake first name (pseudonymized at ingestion). Display only; may collide, never join on it.
      - name: last_name
        description: Fake last name (pseudonymized at ingestion). Display only; may collide, never join on it.
      - name: email_hash
        description: Keyed HMAC-SHA256 of the normalized email (pseudonymized at ingestion). Join key to stg_event_attendance.email_hash.

  - name: stg_projects
    description: One-to-one staging for project records. Extracts all fields needed for Phase 2 dim_project.
    columns:
      - name: id
        description: Airtable record ID (uniqueness key, not human-readable)
        data_tests:
          - not_null
          - unique
      - name: created_time
        description: Timestamp when record was created in Airtable
      - name: last_modified
        description: Last modified timestamp for incremental loading
      - name: project_id
        description: Project auto-ID from Airtable (human-readable identifier)
      - name: project_number
        description: Project number (secondary identifier)
      - name: project_name
        description: Project name
      - name: status
        description: Project status (Intake / Active / Complete / On hold)
      - name: stakeholder
        description: Partner organization name
      - name: description
        description: Project description
      - name: start_date
        description: Project start date
      - name: end_date
        description: Project end date (null until formally closed)

  - name: stg_project_volunteers
    description: Bridge table linking volunteers to projects. Stores linked records and outreach tracking data. Array extraction [0] happens in fct_project_volunteer.
    columns:
      - name: id
        description: Airtable record ID (primary key)
        data_tests:
          - not_null
          - unique
      - name: created_time
        description: Timestamp when record was created in Airtable
      - name: last_modified
        description: Last modified timestamp for incremental loading
      - name: json_blob
        description: All fields from Airtable stored as JSON for flexible extraction in marts

  - name: stg_events
    description: One-to-one staging for event records. All fields stored; dim_event filters for Phase 2 (see DECISIONS.md for event_type field mapping).
    columns:
      - name: id
        description: Airtable record ID (primary key)
        data_tests:
          - not_null
          - unique
      - name: created_time
        description: Timestamp when record was created in Airtable
      - name: last_modified
        description: Last modified timestamp for incremental loading
      - name: event_id
        description: Event auto-ID from Airtable (human-readable identifier)
      - name: name
        description: Event name
      - name: description
        description: Event description
      - name: event_date
        description: Date when the event occurs (2 nulls detected in source data)
      - name: json_blob
        description: All Airtable fields stored as JSON, including event_type, status, location, creator info

  - name: stg_event_attendance
    description: Staging for event attendance, one row per check-in. Repeat check-ins (same event_id, date, and email_hash) are collapsed to the earliest record; see warn_duplicate_check_ins. Volunteer link required for fct_attendance.
    columns:
      - name: id
        description: Airtable record ID (primary key)
        data_tests:
          - not_null
          - unique
      - name: created_time
        description: Timestamp when record was created in Airtable
      - name: last_modified
        description: Last modified timestamp for incremental loading
      - name: attendance_id
        description: Attendance identifier
      - name: email_hash
        description: Keyed HMAC-SHA256 of the attendee's normalized email (pseudonymized at ingestion). Used to match check-ins to volunteers.
      - name: event_id
        description: Event ID (links to dim_event; 0 = monthly meetings)
      - name: volunteer_id
        description: Volunteer ID (links to dim_volunteer; may be null for orphaned records)
      - name: date
        description: Date of attendance (hard not_null test in fct_attendance for monthly meeting tracking)
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: status
        description: Attendance status (Attended / RSVP\'d / No-show / Absent / Remote)
