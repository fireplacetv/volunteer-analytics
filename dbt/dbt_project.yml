name: 'openoakland_analytics'
version: '1.0.0'
config-version: 2

profile: 'openoakland_analytics'

model-paths: ['models']
analysis-paths: ['analysis']
test-paths: ['tests']
seed-paths: ['data']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

models:
  openoakland_analytics:
    staging:
      +materialized: view
      schema: stg_airtable
    marts:
      +materialized: table
      schema: marts

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['openoakland_analytics', 'dbt_utils']
