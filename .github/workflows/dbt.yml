name: dbt Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'dbt/**'
      - 'dlt/**'
      - '.github/workflows/dbt.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'dbt/**'
      - 'dlt/**'
      - '.github/workflows/dbt.yml'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  dbt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      DUCKDB_PATH: /workspace/artifacts/openoakland.duckdb

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t volunteer-analytics:latest .

      - name: Create artifacts directory
        run: |
          mkdir -p artifacts

      - name: Run pipeline unit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            volunteer-analytics:latest \
            python -m unittest discover -s dlt/airtable_pipeline -p 'test_*.py' -v

      - name: Run dlt Airtable ingestion
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          PII_HASH_KEY: ${{ secrets.PII_HASH_KEY }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e AIRTABLE_API_KEY \
            -e AIRTABLE_BASE_ID \
            -e PII_HASH_KEY \
            -e DUCKDB_PATH \
            volunteer-analytics:latest \
            python dlt/airtable_pipeline/run.py

      - name: Run dbt
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e DUCKDB_PATH \
            volunteer-analytics:latest \
            sh -c "cd dbt && dbt deps && dbt parse && dbt build"

      - name: Run dbt tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e DUCKDB_PATH \
            volunteer-analytics:latest \
            sh -c "cd dbt && dbt test"

      - name: Generate dbt docs
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e DUCKDB_PATH \
            volunteer-analytics:latest \
            sh -c "cd dbt && dbt docs generate"

      - name: Upload dbt docs artifact
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dbt/target/

      - name: Comment on PR with CI status
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const conclusion = '${{ job.status }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            let message = conclusion === 'success'
              ? '✅ dbt CI passed'
              : `❌ dbt CI failed - [view details](${runUrl})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: dbt
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
