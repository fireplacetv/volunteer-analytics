name: dbt Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'dbt/**'
      - 'dlt/**'
      - '.github/workflows/dbt.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'dbt/**'
      - 'dlt/**'
      - '.github/workflows/dbt.yml'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  dbt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DUCKDB_PATH: ${{ secrets.DUCKDB_PATH }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r dbt/requirements.txt

      - name: Create artifacts directory
        run: |
          mkdir -p artifacts

      - name: Run dlt Airtable ingestion
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          python dlt/airtable_pipeline/airtable_source.py

      - name: Run dbt
        env:
          DUCKDB_PATH: ${{ github.workspace }}/artifacts/openoakland.duckdb
        run: |
          cd dbt && dbt parse && dbt build

      - name: Run dbt tests
        env:
          DUCKDB_PATH: ${{ github.workspace }}/artifacts/openoakland.duckdb
        run: |
          cd dbt && dbt test

      - name: Generate dbt docs
        if: always()
        env:
          DUCKDB_PATH: ${{ github.workspace }}/artifacts/openoakland.duckdb
        run: |
          cd dbt && dbt docs generate

      - name: Upload dbt docs to GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dbt/target/

      - name: Comment on PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let message = '## dbt Test Results\n\n';
            if (fs.existsSync('./dbt/target/run_results.json')) {
              const results = JSON.parse(fs.readFileSync('./dbt/target/run_results.json', 'utf8'));
              message += `- Models: ${results.stats.total_models} built\n`;
              message += `- Tests: ${results.stats.total_tests} run\n`;
              if (results.stats.failures > 0) {
                message += `- ⚠️ Failures: ${results.stats.failures}\n`;
              } else {
                message += `- ✅ All tests passed\n`;
              }
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
